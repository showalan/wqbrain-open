[project]
name = "wqbrain-open"
version = "0.1.0"
description = "Minimal, resumable batch simulator for WorldQuant Brain (FASTEXPR) with SQLite checkpointing."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[project.scripts]
wqbrain-open = "wqbrain_open.cli:main"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
